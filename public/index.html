<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PACCO Infrastructure Audit</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="header-inner">
      <div class="brand"><strong>PACCO</strong><span>Infrastructure Audit</span></div>
      <nav id="navigation" aria-label="Workspace"></nav>
      <div id="account" class="account"></div>
    </div>
  </header>
  <main id="main" class="workspace" tabindex="-1">
    <div id="screen"><p>Loading the audit register…</p></div>
  </main>
  <div id="toast" class="notice toast" hidden>
    <div id="notice" role="status"></div>
    <button id="close-toast" type="button" aria-label="Dismiss notification">×</button>
  </div>
  <dialog id="action-dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
